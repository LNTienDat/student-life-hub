# New free CDN frontend only. Keeps the existing API and its Neon database.
# Add the actual assigned static URL to the API's ADDITIONAL_FRONTEND_URLS.
services:
  - type: web
    runtime: static
    name: student-life-hub-web
    buildCommand: cd front && npm ci --include=dev && npm run build
    staticPublishPath: front/dist
    autoDeployTrigger: off
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: SKIP_INSTALL_DEPS
        value: "true"
      - key: VITE_API_URL
        value: https://student-life-hub-inx4.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://student-life-hub-inx4.onrender.com; worker-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; upgrade-insecure-requests"
      - path: /sw.js
        name: Cache-Control
        value: no-store
      - path: /sw.js
        name: Service-Worker-Allowed
        value: /
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /manifest.webmanifest
        name: Cache-Control
        value: no-cache
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
